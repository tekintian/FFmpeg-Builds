name: Build FFmpeg (Native)

on:
  push:
    branches: [ci]
  workflow_dispatch:
    inputs:
      license_type:
        description: 'Select license type'
        type: choice
        options:
          - lgpl
          - gpl
        default: lgpl
        required: false
      platforms:
        description: 'Select platforms to build'
        type: choice
        options:
          - all
          - linux64
          - win64
          - macos64
          - macosarm64
        default: macos64
        required: false

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux64
            cc: gcc
            cxx: g++
            configure_extra: --enable-version3
          - os: windows-latest
            target: win64
            cc: cl
            cxx: cl
            configure_extra: --toolchain=msvc --enable-version3
          - os: macos-15
            target: macosarm64
            arch: arm64
            cc: clang
            cxx: clang++
            configure_extra: --enable-version3
          - os: macos-15-intel
            target: macos64
            arch: x86_64
            cc: clang
            cxx: clang++
            configure_extra: --enable-version3
    runs-on: ${{ matrix.os }}
    steps:
      - name: Skip if platform not selected
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.platforms != 'all' && !contains(github.event.inputs.platforms, matrix.target) }}
        run: echo "Skipping ${{ matrix.target }}"

      - name: Checkout
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target) }}
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: ${{ runner.os == 'Linux' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target)) }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            nasm \
            yasm \
            pkg-config \
            libvpx-dev \
            libopus-dev \
            libvorbis-dev \
            autoconf \
            automake \
            libtool \
            cmake

      - name: Build libmp3lame (Linux)
        if: ${{ runner.os == 'Linux' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target)) }}
        run: |
          cd /tmp
          git clone https://github.com/rbrito/lame.git
          cd lame
          ./configure --prefix=$HOME/ffmpeg-install
          make -j$(nproc)
          make install
          echo "PKG_CONFIG_PATH=$HOME/ffmpeg-install/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Install dependencies (macOS)
        if: ${{ runner.os == 'macOS' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target)) }}
        run: |
          arch -${{ matrix.arch }} brew install nasm yasm pkg-config libvpx opus libvorbis cmake autoconf automake libtool lame
          
          # Set correct pkg-config path for architecture
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          else
            echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          fi

      - name: Setup MSVC (Windows)
        if: ${{ runner.os == 'Windows' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target)) }}
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Install NASM and libmp3lame (Windows)
        if: ${{ runner.os == 'Windows' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target)) }}
        run: |
          choco install nasm -y
          choco install lame -y
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Clone FFmpeg
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target) }}
        run: |
          git clone --filter=blob:none --branch master https://github.com/FFmpeg/FFmpeg.git
          cd FFmpeg
          git checkout release/7.1 || git checkout n7.1

      - name: Configure (Linux)
        if: ${{ runner.os == 'Linux' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target)) }}
        run: |
          cd FFmpeg
          ./configure \
            --prefix=$HOME/ffmpeg-install \
            ${{ github.event.inputs.license_type == 'gpl' && '--enable-gpl' || '--disable-gpl' }} \
            --enable-version3 \
            ${{ github.event.inputs.license_type == 'gpl' && '--enable-libx264 --enable-libx265' || '' }} \
            --enable-libmp3lame \
            --enable-libopus \
            --enable-libvorbis \
            --enable-libvpx \
            --extra-cflags="-I$HOME/ffmpeg-install/include" \
            --extra-ldflags="-L$HOME/ffmpeg-install/lib" \
            --extra-version=$(date +%Y%m%d)

      - name: Configure (macOS)
        if: ${{ runner.os == 'macOS' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target)) }}
        run: |
          cd FFmpeg
          
          # Set correct paths for architecture
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            LAME_INCLUDE="/opt/homebrew/include"
            LAME_LIB="/opt/homebrew/lib"
          else
            LAME_INCLUDE="/usr/local/include"
            LAME_LIB="/usr/local/lib"
          fi
          
          ./configure \
            --prefix=$HOME/ffmpeg-install \
            ${{ github.event.inputs.license_type == 'gpl' && '--enable-gpl' || '--disable-gpl' }} \
            --enable-version3 \
            ${{ github.event.inputs.license_type == 'gpl' && '--enable-libx264 --enable-libx265' || '' }} \
            --enable-libmp3lame \
            --enable-libopus \
            --enable-libvorbis \
            --enable-libvpx \
            --extra-cflags="-I${LAME_INCLUDE}" \
            --extra-ldflags="-L${LAME_LIB}" \
            --extra-version=$(date +%Y%m%d)

      - name: Configure (Windows)
        if: ${{ runner.os == 'Windows' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target)) }}
        shell: pwsh
        run: |
          cd FFmpeg
          Write-Host "Current directory: $(Get-Location)"
          
          # Get GPL arguments
          $gplArgs = @()
          if("${{ github.event.inputs.license_type }}" -eq "gpl") {
            $gplArgs += "--enable-gpl", "--enable-libx264", "--enable-libx265"
          } else {
            $gplArgs += "--disable-gpl"
          }
          
          # Build configure command with proper Windows path
          $installPath = Join-Path $HOME "ffmpeg-install"
          
          # Build arguments array - don't include the command itself
          $configArgs = @(
            "--prefix=$installPath",
            "--toolchain=msvc",
            "--enable-version3",
            "--enable-libmp3lame",
            "--enable-libopus",
            "--enable-libvorbis",
            "--enable-libvpx",
            "--extra-version=$(Get-Date -Format "yyyyMMdd")"
          )
          
          # Add GPL arguments
          $configArgs += $gplArgs
          
          Write-Host "Configure command: ./configure $($configArgs -join ' ')"
          
          # Execute configure with error checking
          try {
            # Use dot sourcing for configure script to ensure it runs properly
            bash ./configure $configArgs 2>&1 | Tee-Object -FilePath configure_output.txt
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Configure failed with exit code $LASTEXITCODE"
              exit 1
            }
          } catch {
            Write-Host "Configure threw an exception: $_"
            Write-Host "Full exception details:"
            Write-Host $_.Exception | Format-List -Force
            exit 1
          }

          Write-Host "Configure completed. Checking for config.mak:"
          if (Test-Path "ffbuild/config.mak") {
            Write-Host "✓ ffbuild/config.mak created successfully"
          } else {
            Write-Host "✗ ffbuild/config.mak NOT found"
            Write-Host "Contents of ffbuild directory:"
            Get-ChildItem -Path ffbuild -Force
            exit 1
          }

      - name: Build (Linux/macOS)
        if: ${{ runner.os != 'Windows' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target)) }}
        run: |
          cd FFmpeg
          make -j$(nproc || sysctl -n hw.ncpu || echo 4) V=1
          make install
        env:
          ARCH: ${{ matrix.arch }}

      - name: Build (Windows)
        if: ${{ runner.os == 'Windows' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target)) }}
        shell: pwsh
        run: |
          cd FFmpeg
          
          # Get number of processors for parallel build
          $cores = $env:NUMBER_OF_PROCESSORS
          if (-not $cores -or $cores -eq 0) {
            Write-Host "Could not determine number of cores from environment, using default"
            $cores = 4
          }
          
          Write-Host "Building with $cores cores"
          
          # Verify config exists
          if (-not (Test-Path "ffbuild/config.mak")) {
            Write-Host "Error: ffbuild/config.mak not found. Configure step may have failed."
            exit 1
          }
          
          # Run make with error checking
          try {
            bash make -j$cores V=1
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Make failed with exit code $LASTEXITCODE"
              exit 1
            }
            
            bash make install
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Make install failed with exit code $LASTEXITCODE"
              exit 1
            }
          } catch {
            Write-Host "Make threw an exception: $_"
            exit 1
          }

      - name: Create archive (Linux)
        if: ${{ runner.os == 'Linux' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target)) }}
        run: |
          # Create archive outside the source directory to avoid self-inclusion
          cd $HOME
          archive_name="ffmpeg-${{ matrix.target }}-$(date +%Y%m%d).tar.gz"
          tar czf "$archive_name" --warning=no-file-changed -C "ffmpeg-install" .

      - name: Create archive (macOS)
        if: ${{ runner.os == 'macOS' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target)) }}
        run: |
          # Create archive outside the source directory to avoid self-inclusion
          cd $HOME
          archive_name="ffmpeg-${{ matrix.target }}-$(date +%Y%m%d).tar.gz"
          tar czf "$archive_name" -C "ffmpeg-install" .

      - name: Create archive (Windows)
        if: ${{ runner.os == 'Windows' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target)) }}
        shell: pwsh
        run: |
          cd $HOME
          $archive_name = "ffmpeg-${{ matrix.target }}-$(Get-Date -Format 'yyyyMMdd').zip"
          Compress-Archive -Path "ffmpeg-install/*" -DestinationPath "$archive_name" -Force

      - name: Upload artifacts
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target) }}
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}-${{ github.event.inputs.license_type || 'lgpl' }}
          path: |
            ${{ runner.os != 'Windows' && format('{0}/ffmpeg-{1}-*.tar.gz', env.HOME, matrix.target) || format('{0}\ffmpeg-{1}-*.zip', env.HOME, matrix.target) }}
name: Build FFmpeg (Native)

on:
  push:
    branches: [ci]
  workflow_dispatch:
    inputs:
      license_type:
        description: 'Select license type'
        type: choice
        options:
          - lgpl
          - gpl
        default: lgpl
        required: false
      platforms:
        description: 'Select platforms to build'
        type: choice
        options:
          - all
          - linux64
          - win64
          - macos64
          - macosarm64
        default: macos64
        required: false

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux64
            cc: gcc
            cxx: g++
            configure_extra: --enable-version3
          - os: windows-latest
            target: win64
            cc: cl
            cxx: cl
            configure_extra: --toolchain=msvc --enable-version3
          - os: macos-15
            target: macosarm64
            arch: arm64
            cc: clang
            cxx: clang++
            configure_extra: --enable-version3
          - os: macos-15-intel
            target: macos64
            arch: x86_64
            cc: clang
            cxx: clang++
            configure_extra: --enable-version3
    runs-on: ${{ matrix.os }}
    steps:
      - name: Skip if platform not selected
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.platforms != 'all' && !contains(github.event.inputs.platforms, matrix.target) }}
        run: echo "Skipping ${{ matrix.target }}"

      - name: Checkout
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target) }}
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: ${{ runner.os == 'Linux' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target)) }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            nasm \
            yasm \
            pkg-config \
            libvpx-dev \
            libopus-dev \
            libvorbis-dev \
            autoconf \
            automake \
            libtool \
            cmake

      - name: Build libmp3lame (Linux)
        if: ${{ runner.os == 'Linux' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target)) }}
        run: |
          cd /tmp
          git clone https://github.com/rbrito/lame.git
          cd lame
          ./configure --prefix=$HOME/ffmpeg-install
          make -j$(nproc)
          make install
          echo "PKG_CONFIG_PATH=$HOME/ffmpeg-install/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Install dependencies (macOS)
        if: ${{ runner.os == 'macOS' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target)) }}
        run: |
          arch -${{ matrix.arch }} brew install nasm yasm pkg-config libvpx opus libvorbis cmake autoconf automake libtool lame

      - name: Setup MSVC (Windows)
        if: ${{ runner.os == 'Windows' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target)) }}
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Install NASM and libmp3lame (Windows)
        if: ${{ runner.os == 'Windows' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target)) }}
        run: |
          choco install nasm -y
          choco install lame -y
          echo "C:\\Program Files\\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Clone FFmpeg
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target) }}
        run: |
          git clone --filter=blob:none --branch master https://github.com/FFmpeg/FFmpeg.git
          cd FFmpeg
          git checkout release/7.1 || git checkout n7.1

      - name: Configure (Linux)
        if: ${{ runner.os == 'Linux' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target)) }}
        run: |
          cd FFmpeg
          ./configure \
            --prefix=$HOME/ffmpeg-install \
            ${{ github.event.inputs.license_type == 'gpl' && '--enable-gpl' || '--disable-gpl' }} \
            --enable-version3 \
            ${{ github.event.inputs.license_type == 'gpl' && '--enable-libx264 --enable-libx265' || '' }} \
            --enable-libmp3lame \
            --enable-libopus \
            --enable-libvorbis \
            --enable-libvpx \
            --extra-cflags="-I$HOME/ffmpeg-install/include" \
            --extra-ldflags="-L$HOME/ffmpeg-install/lib" \
            --extra-version=$(date +%Y%m%d)

      - name: Configure (macOS)
        if: ${{ runner.os == 'macOS' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target)) }}
        run: |
          cd FFmpeg
          ./configure \
            --prefix=$HOME/ffmpeg-install \
            ${{ github.event.inputs.license_type == 'gpl' && '--enable-gpl' || '--disable-gpl' }} \
            --enable-version3 \
            ${{ github.event.inputs.license_type == 'gpl' && '--enable-libx264 --enable-libx265' || '' }} \
            --enable-libmp3lame \
            --enable-libopus \
            --enable-libvorbis \
            --enable-libvpx \
            --extra-version=$(date +%Y%m%d)

      - name: Configure (Windows)
        if: ${{ runner.os == 'Windows' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target)) }}
        shell: pwsh
        run: |
          cd FFmpeg
          Write-Host "Current directory: $(Get-Location)"
          
          $gplArgs = if("${{ github.event.inputs.license_type }}" -eq "gpl") { "--enable-gpl", "--enable-libx264", "--enable-libx265" } else { "--disable-gpl" }
          
          Write-Host "Running configure with args: $gplArgs"
          
          # Check for various possible lame paths
          $possibleLamePaths = @(
            "C:\Program Files\lame",
            "C:\Program Files (x86)\lame",
            "C:\Program Files\Lame For Audacity",
            "C:\Program Files (x86)\Lame For Audacity"
          )
          
          $lamePath = ""
          foreach ($path in $possibleLamePaths) {
            if (Test-Path "$path\include\lame\lame.h") {
              $lamePath = $path
              break
            }
          }
          
          if (-not $lamePath) {
            Write-Host "Warning: Could not find lame include files, trying default path"
            $lamePath = "C:\Program Files\lame"
          }
          
          Write-Host "Using lame path: $lamePath"
          
          # Build configure command with proper paths
          $configCmd = "./configure "
          $configCmd += "--prefix=$HOME/ffmpeg-install "
          $configCmd += "--toolchain=msvc "
          $configCmd += ($gplArgs -join " ") + " "
          $configCmd += "--enable-version3 "
          $configCmd += "--enable-libmp3lame "
          $configCmd += "--enable-libopus "
          $configCmd += "--enable-libvorbis "
          $configCmd += "--enable-libvpx "
          $configCmd += "--extra-cflags=-I${lamePath}\include "
          $configCmd += "--extra-ldflags=-LIBPATH:${lamePath}\lib "
          $configCmd += "--extra-version=$(Get-Date -Format "yyyyMMdd")"
          
          Write-Host "Full configure command: $configCmd"
          
          # Execute configure
          Invoke-Expression -Command $configCmd

          Write-Host "Configure completed. Checking for config.mak:"
          if (Test-Path "ffbuild/config.mak") {
            Write-Host "✓ ffbuild/config.mak created successfully"
          } else {
            Write-Host "✗ ffbuild/config.mak NOT found"
            Get-ChildItem -Recurse | Where-Object { $_.Name -eq "config.mak" }
          }

      - name: Build (Linux/macOS)
        if: ${{ runner.os != 'Windows' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target)) }}
        run: |
          cd FFmpeg
          make -j$(nproc || sysctl -n hw.ncpu || echo 4) V=1
          make install
        env:
          ARCH: ${{ matrix.arch }}

      - name: Build (Windows)
        if: ${{ runner.os == 'Windows' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target)) }}
        shell: pwsh
        run: |
          cd FFmpeg
          
          # Get number of processors for parallel build
          $cores = $env:NUMBER_OF_PROCESSORS
          if (-not $cores -or $cores -eq 0) { 
            Write-Host "Could not determine number of cores from environment, using default"
            $cores = 4 
          }
          
          Write-Host "Building with $cores cores"
          
          # Verify config exists
          if (-not (Test-Path "ffbuild/config.mak")) {
            Write-Host "Error: ffbuild/config.mak not found. Configure step may have failed."
            exit 1
          }
          
          # Run make
          & make -j$cores V=1
          & make install

      - name: Create archive (Linux/macOS)
        if: ${{ runner.os != 'Windows' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target)) }}
        run: |
          cd $HOME/ffmpeg-install
          tar czf ffmpeg-${{ matrix.target }}-$(date +%Y%m%d).tar.gz .

      - name: Create archive (Windows)
        if: ${{ runner.os == 'Windows' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target)) }}
        shell: pwsh
        run: |
          Compress-Archive -Path "$HOME\ffmpeg-install\*" -DestinationPath "ffmpeg-${{ matrix.target }}-$(Get-Date -Format 'yyyyMMdd').zip"

      - name: Upload artifacts
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.target) }}
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}-${{ github.event.inputs.license_type || 'lgpl' }}
          path: |
            ffmpeg-${{ matrix.target }}-*.tar.gz
            ffmpeg-${{ matrix.target }}-*.zip